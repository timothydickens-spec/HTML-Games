<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash - Local Leaderboard</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
h1 { margin: 15px 0 5px; }
#gameContainer {
    position: relative;
    width: 900px;
    max-width: 95vw;
    margin: 10px auto;
}
canvas {
    width: 100%;
    background: linear-gradient(#202050, #101020);
    border: 4px solid white;
    display: block;
}
#instructions { color: #ccc; margin: 10px; }
#gameOver {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.92);
    padding: 25px 35px;
    border: 3px solid white;
    z-index: 5;
    min-width: 300px;
}
input, button {
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: 0;
    margin: 4px;
}
button { cursor: pointer; }
#leaderboard {
    width: 900px;
    max-width: 95vw;
    margin: 20px auto;
    padding: 15px;
    background: #181818;
    border: 2px solid #444;
}
.scoreRow {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid #333;
}
.clearButton {
    background: #aa2222;
    color: white;
}
</style>
</head>

<body>

<h1>Geometry Dash</h1>

<div id="gameContainer">
    <canvas id="gameCanvas" width="900" height="450"></canvas>

    <div id="gameOver">
        <h2>Game Over!</h2>
        <p id="finalScore">Score: 0</p>
        <input id="playerName" maxlength="20" placeholder="Enter your name">
        <br>
        <button onclick="saveScore()">Save Score</button>
        <button onclick="restartGame()">Play Again</button>
    </div>
</div>

<div id="instructions">
    Press <strong>SPACE</strong> or <strong>CLICK</strong> to jump!
</div>

<div id="leaderboard">
    <h2>🏆 Local Leaderboard</h2>
    <div id="scores"></div>
    <br>
    <button class="clearButton" onclick="clearLeaderboard()">
        Clear Leaderboard
    </button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const groundY = 380;

let gameRunning = true;
let score = 0;
let speed = 5;
let frameCount = 0;
let scoreSaved = false;
let obstacles = [];

const player = {
    x: 100,
    y: groundY - 40,
    width: 40,
    height: 40,
    velocityY: 0,
    gravity: 0.8,
    jumpPower: -14,
    onGround: true,
    rotation: 0
};


// =============================
// LEADERBOARD / LOCAL STORAGE
// =============================

function getLeaderboard() {
    try {
        return JSON.parse(localStorage.getItem("geometryDashLeaderboard")) || [];
    } catch {
        return [];
    }
}

function saveLeaderboard(scores) {
    localStorage.setItem(
        "geometryDashLeaderboard",
        JSON.stringify(scores)
    );
}

function displayLeaderboard() {

    const container = document.getElementById("scores");
    const scores = getLeaderboard();

    if (scores.length === 0) {
        container.innerHTML = "<p>No scores yet. Be the first!</p>";
        return;
    }

    container.innerHTML = scores.map((entry, index) => `
        <div class="scoreRow">
            <span>${index + 1}. ${escapeHtml(entry.name)}</span>
            <strong>${entry.score}</strong>
        </div>
    `).join("");
}

function saveScore() {

    if (scoreSaved) return;

    const nameInput = document.getElementById("playerName");
    const name = nameInput.value.trim() || "Anonymous";
    const finalScore = Math.floor(score / 10);

    let scores = getLeaderboard();

    scores.push({
        name: name.substring(0, 20),
        score: finalScore
    });

    scores.sort((a, b) => b.score - a.score);

    // Keep the top 10
    scores = scores.slice(0, 10);

    saveLeaderboard(scores);

    scoreSaved = true;

    displayLeaderboard();

    document.getElementById("finalScore").textContent =
        "Score saved: " + finalScore;
}

function clearLeaderboard() {

    if (confirm("Are you sure you want to clear the leaderboard?")) {
        localStorage.removeItem("geometryDashLeaderboard");
        displayLeaderboard();
    }
}

function escapeHtml(text) {

    return text.replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[character]));
}


// =============================
// GAME INPUT
// =============================

function jump() {

    if (!gameRunning) return;

    if (player.onGround) {
        player.velocityY = player.jumpPower;
        player.onGround = false;
    }
}

document.addEventListener("keydown", event => {

    if (event.code === "Space") {
        event.preventDefault();
        jump();
    }

});

canvas.addEventListener("click", jump);


// =============================
// OBSTACLES
// =============================

function createObstacle() {

    const size = 35 + Math.random() * 15;

    obstacles.push({
        x: canvas.width + 20,
        y: groundY - size,
        width: size,
        height: size
    });
}


// =============================
// COLLISION
// =============================

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


// =============================
// PLAYER
// =============================

function updatePlayer() {

    player.velocityY += player.gravity;
    player.y += player.velocityY;

    if (player.y + player.height >= groundY) {

        player.y = groundY - player.height;
        player.velocityY = 0;
        player.onGround = true;
        player.rotation = 0;

    } else {

        player.onGround = false;
        player.rotation += 0.12;

    }
}


// =============================
// OBSTACLE UPDATE
// =============================

function updateObstacles() {

    for (const obstacle of obstacles) {

        obstacle.x -= speed;

        if (collision(player, obstacle)) {
            gameOver();
        }
    }

    obstacles = obstacles.filter(
        obstacle => obstacle.x + obstacle.width > 0
    );
}


// =============================
// DRAW PLAYER
// =============================

function drawPlayer() {

    ctx.save();

    const centerX = player.x + player.width / 2;
    const centerY = player.y + player.height / 2;

    ctx.translate(centerX, centerY);
    ctx.rotate(player.rotation);

    ctx.fillStyle = "#00ffff";

    ctx.fillRect(
        -20,
        -20,
        40,
        40
    );

    ctx.fillStyle = "#111";

    ctx.fillRect(-12, -10, 7, 7);
    ctx.fillRect(5, -10, 7, 7);

    ctx.fillRect(-10, 7, 20, 5);

    ctx.restore();
}


// =============================
// DRAW OBSTACLES
// =============================

function drawObstacles() {

    for (const obstacle of obstacles) {

        ctx.fillStyle = "#ff3333";

        ctx.beginPath();

        ctx.moveTo(
            obstacle.x,
            obstacle.y + obstacle.height
        );

        ctx.lineTo(
            obstacle.x + obstacle.width / 2,
            obstacle.y
        );

        ctx.lineTo(
            obstacle.x + obstacle.width,
            obstacle.y + obstacle.height
        );

        ctx.closePath();

        ctx.fill();
    }
}


// =============================
// DRAW GROUND
// =============================

function drawGround() {

    ctx.fillStyle = "#333";

    ctx.fillRect(
        0,
        groundY,
        canvas.width,
        canvas.height - groundY
    );

    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 3;

    for (let x = 0; x < canvas.width; x += 40) {

        ctx.beginPath();

        ctx.moveTo(x, groundY);
        ctx.lineTo(x + 20, canvas.height);

        ctx.stroke();
    }
}


// =============================
// DRAW SCORE
// =============================

function drawScore() {

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";

    ctx.fillText(
        "Score: " + Math.floor(score / 10),
        20,
        35
    );
}


// =============================
// GAME OVER
// =============================

function gameOver() {

    if (!gameRunning) return;

    gameRunning = false;
    scoreSaved = false;

    const final = Math.floor(score / 10);

    document.getElementById("finalScore").textContent =
        "Score: " + final;

    document.getElementById("gameOver").style.display =
        "block";
}


// =============================
// RESTART
// =============================

function restartGame() {

    player.y = groundY - player.height;
    player.velocityY = 0;
    player.rotation = 0;

    obstacles = [];

    score = 0;
    speed = 5;
    frameCount = 0;

    gameRunning = true;
    scoreSaved = false;

    document.getElementById("playerName").value = "";

    document.getElementById("gameOver").style.display =
        "none";
}


// =============================
// GAME LOOP
// =============================

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    // Background grid
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 50) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += 50) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    if (gameRunning) {

        updatePlayer();
        updateObstacles();

        frameCount++;

        if (frameCount % 100 === 0) {
            createObstacle();
        }

        score++;

        if (score % 500 === 0) {
            speed += 0.5;
        }
    }

    drawGround();
    drawObstacles();
    drawPlayer();
    drawScore();

    requestAnimationFrame(gameLoop);
}


// =============================
// START
// =============================

displayLeaderboard();
gameLoop();

</script>

</body>
</html>
